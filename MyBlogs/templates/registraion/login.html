{% extends "layout.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center">
	<div class="col-md-6 col-lg-5">
		<h1 class="mb-4">Sign In</h1>
		<form method="post">
			{% csrf_token %}
			{{ form.as_p }}
			<button type="submit" class="btn btn-light">Sign In</button>
		</form>
	</div>
</div>
{% endblock %}
